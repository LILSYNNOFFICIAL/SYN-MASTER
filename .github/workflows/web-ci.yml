name: SYN MASTER Web CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'public/**'
      - 'scripts/check-bundle-budget.mjs'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'vite.config.ts'
      - 'index.html'
      - 'public/**'
      - 'scripts/check-bundle-budget.mjs'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg for export integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Production startup smoke test (Node 22)
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export PORT=4179
          npm start > /tmp/syn-master-start.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:$PORT/api/health" > /tmp/syn-master-health.json; then
              node -e 'const h = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (h.ok !== true) process.exit(1);' /tmp/syn-master-health.json
              curl --fail --silent "http://127.0.0.1:$PORT/" > /dev/null
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/syn-master-start.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/syn-master-start.log
          exit 1
