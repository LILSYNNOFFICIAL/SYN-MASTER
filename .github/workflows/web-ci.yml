name: SYN MASTER Web CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server.ts'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install FFmpeg for export integration tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run lint
      - name: Production build
        run: npm run build
